name: Cloud360 Source Tests (No XEX)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux unit tests and XSDK header check
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Cloud360
        uses: actions/checkout@v4

      - name: Install host libcurl for source-only checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcurl4-openssl-dev pkg-config

      - name: Run menu test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c tests/test_menu.c -o /tmp/cloud360-menu
          /tmp/cloud360-menu

      - name: Run animation test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c src/ui.c tests/test_ui.c -o /tmp/cloud360-ui
          /tmp/cloud360-ui

      - name: Run settings test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c tests/test_settings.c -o /tmp/cloud360-settings
          /tmp/cloud360-settings

      - name: Run network state machine test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/network.c tests/test_network.c -o /tmp/cloud360-network
          /tmp/cloud360-network

      - name: Run asynchronous DNS/TCP probe test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/probe.c tests/test_probe.c -o /tmp/cloud360-probe
          /tmp/cloud360-probe

      - name: Run local TCP adapter test
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            src/probe_platform.c tests/test_probe_platform.c \
            -o /tmp/cloud360-probe-platform
          /tmp/cloud360-probe-platform

      - name: Test bounded HTTPS state machine (host mocks)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/https.c tests/test_https.c -o /tmp/cloud360-https
          /tmp/cloud360-https

      - name: Test HTTPS adapter without libcurl
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/https.c src/https_curl.c tests/test_https_curl.c \
            -pthread -o /tmp/cloud360-https-no-curl
          /tmp/cloud360-https-no-curl

      - name: Test HTTPS adapter with host libcurl (no network)
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            -DCLOUD360_WITH_CURL=1 \
            src/https.c src/https_curl.c tests/test_https_curl.c \
            -pthread $(pkg-config --cflags --libs libcurl) \
            -o /tmp/cloud360-https-curl
          /tmp/cloud360-https-curl

      - name: Test bounded JSON catalog, malformed data and search
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/catalog.c tests/test_catalog.c -o /tmp/cloud360-catalog
          /tmp/cloud360-catalog

      - name: Test atomic catalog refresh with mocked HTTPS
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/https.c src/catalog.c src/catalog_runtime.c \
            tests/test_catalog_runtime.c -o /tmp/cloud360-catalog-runtime
          /tmp/cloud360-catalog-runtime

      - name: Test OAuth RFC8628 flow and bounded token JSON
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/oauth.c tests/test_oauth.c -o /tmp/cloud360-oauth
          /tmp/cloud360-oauth
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/oauth_json.c tests/test_oauth_json.c \
            -o /tmp/cloud360-oauth-json
          /tmp/cloud360-oauth-json

      - name: Test asynchronous OAuth with mocked TLS transport
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/oauth.c src/oauth_json.c src/oauth_runtime.c \
            tests/test_oauth_runtime.c -o /tmp/cloud360-oauth-runtime
          /tmp/cloud360-oauth-runtime

      - name: Test fail-closed OAuth HTTPS POST adapter
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            src/https.c src/https_curl.c tests/test_https_post.c \
            -pthread -o /tmp/cloud360-https-post-stub
          /tmp/cloud360-https-post-stub
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            -DCLOUD360_WITH_CURL=1 \
            src/https.c src/https_curl.c tests/test_https_post.c \
            -pthread $(pkg-config --cflags --libs libcurl) \
            -o /tmp/cloud360-https-post-curl
          /tmp/cloud360-https-post-curl

      - name: Checkout XSDK headers only
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Run icon test
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            -I "$HOME/xsdk/include" src/icons.c tests/test_icons.c -o /tmp/cloud360-icons
          /tmp/cloud360-icons

      - name: Check native console source syntax
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -fsyntax-only \
            -I "$HOME/xsdk/include" \
            src/main.c src/render.c src/icons.c src/network.c \
            src/probe.c src/probe_platform.c src/https.c src/https_curl.c \
            src/catalog.c src/catalog_runtime.c src/oauth.c \
            src/oauth_json.c src/oauth_runtime.c

      - name: Confirm no .xex is generated
        run: |
          if find . -type f -name '*.xex' | grep -q .; then
            echo "Unexpected XEX in source-only CI"
            exit 1
          fi
          echo "Source checks passed. No Xbox binary built."
