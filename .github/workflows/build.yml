name: Build Cloud360 XEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - ".github/workflows/build.yml"
      - "tests/**"
      - "scripts/**"
      - "docs/XENIA.md"

permissions:
  contents: read

jobs:
  build:
    name: Compile Xbox 360 XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Cloud360
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo libgmp-dev libmpfr-dev \
            libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Test menu logic (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c tests/test_menu.c -o /tmp/cloud360-menu-tests
          /tmp/cloud360-menu-tests

      - name: Test animation and transitions (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c src/ui.c tests/test_ui.c -o /tmp/cloud360-ui-tests
          /tmp/cloud360-ui-tests

      - name: Test settings persistence (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c tests/test_settings.c -o /tmp/cloud360-settings-tests
          /tmp/cloud360-settings-tests

      - name: Checkout pinned XSDK
        run: |
          # xsdk_gpu_swap is an internal ABI: fix the SDK revision.
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" fetch --depth 1 origin 8c58c7a3fb37bb261c5a11a8a1f4fa8a8bfd0d28
          git -C "$HOME/xsdk" checkout --detach 8c58c7a3fb37bb261c5a11a8a1f4fa8a8bfd0d28

      - name: Test original pixel icons (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            -I "$HOME/xsdk/include" src/icons.c tests/test_icons.c -o /tmp/cloud360-icons-tests
          /tmp/cloud360-icons-tests

      - name: Test Xenia frontbuffer ownership (host mocks)
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            -I "$HOME/xsdk/include" src/xenia_present.c tests/test_xenia_present.c \
            -o /tmp/cloud360-xenia-tests
          /tmp/cloud360-xenia-tests

      - name: Validate Xbox and Xenia source syntax
        run: |
          gcc -std=gnu17 -Wall -Wextra -Werror -fsyntax-only \
            -I "$HOME/xsdk/include" src/main.c src/render.c src/icons.c
          gcc -std=gnu17 -Wall -Wextra -Werror -fsyntax-only \
            -DCLOUD360_XENIA=1 -I "$HOME/xsdk/include" \
            src/main.c src/xenia_present.c src/render.c src/icons.c

      - name: Identify XSDK revision
        id: xsdk_revision
        run: echo "sha=$(git -C "$HOME/xsdk" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore XSDK toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
          key: xsdk-toolchain-ubuntu-24.04-${{ steps.xsdk_revision.outputs.sha }}

      - name: Build XSDK cross-compiler
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS="$(nproc)" bash tools/toolchain/build.sh

      - name: Save XSDK toolchain cache
        if: success() && steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
          key: xsdk-toolchain-ubuntu-24.04-${{ steps.xsdk_revision.outputs.sha }}

      - name: Build XSDK libraries
        run: |
          echo "$HOME/xsdk-gcc/bin" >> "$GITHUB_PATH"
          cd "$HOME/xsdk"
          make -j"$(nproc)"

      - name: Configure Cloud360
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile Cloud360
        run: cmake --build build --verbose

      - name: Validate both XEX2 files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ("cloud360.xex", "cloud360_xenia.xex"):
              file = Path("build") / name
              data = file.read_bytes()
              assert data.startswith(b"XEX2") and len(data) > 128, f"Invalid XEX2: {file}"
              print(f"VALID XEX2 {file} ({len(data)} bytes)")
          PY

      - name: Upload Xbox 360 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud360-Xbox360-XEX
          path: build/cloud360.xex
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental Xenia artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud360-Xenia-XEX
          path: |
            build/cloud360_xenia.xex
            scripts/Iniciar-Cloud360-Xenia.bat
            docs/XENIA.md
          if-no-files-found: error
          retention-days: 14
