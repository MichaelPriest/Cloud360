name: Build Cloud360 XEX

# Release build is manual-only. Never build an XEX on a source push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Xbox 360 XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Cloud360
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo libgmp-dev libmpfr-dev \
            libmpc-dev curl xz-utils patch python3 cmake ninja-build git

      - name: Test menu logic (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c tests/test_menu.c -o /tmp/cloud360-menu-tests
          /tmp/cloud360-menu-tests

      - name: Test animation and transitions (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c src/menu.c src/ui.c tests/test_ui.c -o /tmp/cloud360-ui-tests
          /tmp/cloud360-ui-tests

      - name: Test local network diagnostics (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/network.c tests/test_network.c -o /tmp/cloud360-network-tests
          /tmp/cloud360-network-tests

      - name: Test settings persistence (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/settings.c tests/test_settings.c -o /tmp/cloud360-settings-tests
          /tmp/cloud360-settings-tests

      - name: Test DNS/TCP diagnostics (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/probe.c tests/test_probe.c -o /tmp/cloud360-probe
          /tmp/cloud360-probe
          gcc -std=gnu17 -Wall -Wextra -Werror -pedantic \
            src/probe_platform.c tests/test_probe_platform.c \
            -o /tmp/cloud360-probe-platform
          /tmp/cloud360-probe-platform

      - name: Test HTTPS state and fail-closed transport (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/https.c tests/test_https.c -o /tmp/cloud360-https
          /tmp/cloud360-https
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/https.c src/https_curl.c tests/test_https_curl.c \
            -o /tmp/cloud360-https-stub
          /tmp/cloud360-https-stub

      - name: Test catalog parsing and asynchronous refresh (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/catalog.c tests/test_catalog.c -o /tmp/cloud360-catalog
          /tmp/cloud360-catalog
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/https.c src/catalog.c src/catalog_runtime.c \
            tests/test_catalog_runtime.c -o /tmp/cloud360-catalog-runtime
          /tmp/cloud360-catalog-runtime

      - name: Test OAuth state, JSON and worker without XEX
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/oauth.c tests/test_oauth.c -o /tmp/cloud360-oauth
          /tmp/cloud360-oauth
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/oauth_json.c tests/test_oauth_json.c \
            -o /tmp/cloud360-oauth-json
          /tmp/cloud360-oauth-json
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/oauth.c src/oauth_json.c src/oauth_runtime.c \
            tests/test_oauth_runtime.c -o /tmp/cloud360-oauth-runtime
          /tmp/cloud360-oauth-runtime

      - name: Test Xbox U-token and XSTS handshake (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/xbl.c tests/test_xbl.c -o /tmp/cloud360-xbl
          /tmp/cloud360-xbl
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -pthread \
            src/xbl.c src/xbl_runtime.c tests/test_xbl_runtime.c \
            -o /tmp/cloud360-xbl-runtime
          /tmp/cloud360-xbl-runtime

      - name: Test cloud session state machine without XEX
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            src/session.c tests/test_session.c -o /tmp/cloud360-session
          /tmp/cloud360-session

      - name: Checkout open XSDK
        run: |
          git clone --depth 1 https://github.com/xenosworks/xsdk.git "$HOME/xsdk"

      - name: Test original pixel icons (host GCC)
        run: |
          gcc -std=c17 -Wall -Wextra -Werror -pedantic \
            -I "$HOME/xsdk/include" src/icons.c tests/test_icons.c -o /tmp/cloud360-icons-tests
          /tmp/cloud360-icons-tests

      - name: Validate XEX source syntax with XSDK headers
        run: gcc -std=gnu17 -Wall -Wextra -Werror -fsyntax-only -I "$HOME/xsdk/include" src/main.c src/render.c src/icons.c src/network.c src/probe.c src/probe_platform.c src/https.c src/https_curl.c src/catalog.c src/catalog_runtime.c src/oauth.c src/oauth_json.c src/oauth_runtime.c src/xbl.c src/xbl_runtime.c src/session.c

      - name: Identify XSDK revision
        id: xsdk_revision
        run: echo "sha=$(git -C "$HOME/xsdk" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore XSDK toolchain cache
        id: toolchain_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
          key: xsdk-toolchain-ubuntu-24.04-${{ steps.xsdk_revision.outputs.sha }}

      - name: Build XSDK cross-compiler
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS="$(nproc)" bash tools/toolchain/build.sh

      - name: Save XSDK toolchain cache
        if: success() && steps.toolchain_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/xsdk-gcc
            ~/xsdk-gcc-work
          key: xsdk-toolchain-ubuntu-24.04-${{ steps.xsdk_revision.outputs.sha }}

      - name: Build XSDK libraries
        run: |
          echo "$HOME/xsdk-gcc/bin" >> "$GITHUB_PATH"
          cd "$HOME/xsdk"
          make -j"$(nproc)"

      - name: Configure Cloud360
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Compile Cloud360
        run: cmake --build build --verbose

      - name: Upload XEX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cloud360-XEX
          path: build/**/*.xex
          if-no-files-found: error
          retention-days: 14
